<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Capítulo</title>
</head>
<body style="margin:0">
<!-- /fx/<serie>/leer/<n>: el capítulo n de esa serie, con 6 páginas (o las que diga ?pags=) -->
<!-- (un botón del sitio: para ver que el foco vuelve a él al cerrar un diálogo) -->
<button id="antes" type="button" style="position:fixed;top:4px;left:4px;z-index:5">Modo noche</button>
<script>
  const [, serie, n] = location.pathname.match(/^\/fx\/([\w-]+)\/leer\/(\d+)$/) || [];
  const pags = +new URLSearchParams(location.search).get('pags') || 6;
  document.title = 'Serie ' + serie[0].toUpperCase() + serie.slice(1) + ' Capítulo ' + n + ' | Sitio de prueba';
  if (serie === 'tarde') {
    // La serie "tarde" (2.11.3): tres banners de fondo numerados desde el principio, y las páginas
    // <img> recién a los 3 s, como un sitio que arma la página con JavaScript. Las páginas son las <img>.
    document.write([1, 2, 3].map(k => '<div style="width:600px;height:150px;background-image:url(/fx/img/banners/banner-' + k + '.jpg)"></div>').join(''));
    setTimeout(() => {
      for (let i = 1; i <= pags; i++) {
        const im = document.createElement('img');
        im.style.display = 'block'; im.width = 420; im.height = 640; im.src = '/fx/img/' + serie + '/' + n + '/' + i + '.jpg';
        document.body.appendChild(im);
      }
    }, 3000);
  } else if (serie === 'diferida') {
    // La serie "diferida" (2.11.4): las páginas con carga diferida (un marcador de 1×1 y la página en
    // data-src, sin nada que las cambie), y arriba un banner de otra carpeta (en la prueba responde 503)
    document.write('<img style="display:block" width="728" height="90" src="/fx/img/publicidad/banner.jpg">');
    for (let i = 1; i <= pags; i++) {
      document.write('<img style="display:block" width="420" height="640" src="/fx/img/px.png" data-src="/fx/img/' + serie + '/' + n + '/' + i + '.jpg">');
    }
  } else {
    // La serie "banner" (2.11.4): arriba de las páginas, un banner de otra carpeta (en la prueba responde 503)
    if (serie === 'banner') document.write('<img style="display:block" width="728" height="90" src="/fx/img/publicidad/banner.jpg">');
    for (let i = 1; i <= pags; i++) {
      document.write('<img style="display:block" width="420" height="640" src="/fx/img/' + serie + '/' + n + '/' + i + '.jpg">');
    }
  }
</script>
</body>
</html>
