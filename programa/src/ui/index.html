<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Manga Reader</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <header>
    <form id="buscar">
      <span class="logo">📖</span>
      <!-- Al escribir, ofrece las últimas direcciones analizadas a mano -->
      <input id="url" type="text" spellcheck="false" autocomplete="off" list="recientes"
             placeholder="Pegá la dirección de una página: un catálogo, una serie o un capítulo">
      <datalist id="recientes"></datalist>
      <button class="main" id="analizar" type="submit">Analizar</button>
      <button id="verPegar" type="button" title="Pegar una lista de links de capítulos">Pegar links</button>
      <button id="verGuardados" type="button" title="Tus favoritos: sitios, catálogos y series guardados">⭐ Favoritos</button>
      <button id="verSiguiendo" type="button" title="Las series que seguís: buscar lo nuevo y bajarlo">📌 Siguiendo</button>
      <button id="verHistorial" type="button" title="El registro de todo lo que bajaste con el programa">🗂 Historial</button>
    </form>
    <!-- Siguiendo: las series que seguís. "Buscar lo nuevo" mira sus páginas y dice qué no tenés -->
    <div id="siguiendo" hidden>
      <div class="barra">
        <button class="main" id="buscarNuevo" type="button" title="Abre la página de cada serie, de a una, y dice qué capítulos hay que no tenés">Buscar lo nuevo</button>
        <button id="bajarNuevo" type="button" hidden>Bajar todo lo nuevo</button>
        <span id="siguiendoMsg" class="tenue"></span>
      </div>
      <div id="siguiendoLista"></div>
    </div>
    <!-- Historial: lo que se bajó, por serie, aunque ya no esté en la carpeta -->
    <div id="historial" hidden>
      <div class="barra">
        <input id="historialFiltro" type="text" spellcheck="false" autocomplete="off" placeholder="Buscar una serie en lo que ya bajaste…">
        <span id="historialCuenta" class="tenue"></span>
      </div>
      <div id="historialLista"></div>
    </div>
    <!-- Favoritos: arriba se pega (un link o muchos) y queda guardado; abajo, la lista -->
    <div id="guardados" hidden>
      <textarea id="listaLinks" spellcheck="false" placeholder="Pegá acá un link o muchos y quedan guardados en tus favoritos. Uno por renglón, como los tengas:&#10;Mi sitio: https://sitio.com/ — lo que quieras anotar&#10;https://otro.com/catalogo"></textarea>
      <div class="barra">
        <button class="main" id="agregarLista" type="button" title="Guarda los links escritos en el cuadro. Al pegar se guardan solos">Guardar en favoritos</button>
        <button id="guardarActual" type="button" title="Guarda en tus favoritos la dirección que está en el cuadro de arriba">＋ La dirección de arriba</button>
        <span id="guardadosMsg" class="tenue"></span>
      </div>
      <div class="barra" id="guardadosBarra">
        <input id="guardadosFiltro" type="text" spellcheck="false" autocomplete="off" placeholder="Buscar en tus favoritos…">
        <select id="guardadosTipo" title="Mostrar solo los de un tipo">
          <option value="">Tipo: todos</option>
          <option value="manga">Manga</option>
          <option value="comics">Cómics</option>
        </select>
        <select id="guardadosIdioma" title="Mostrar solo los de un idioma">
          <option value="">Idioma: todos</option>
          <option value="es">Español</option>
          <option value="en">Inglés</option>
          <option value="otro">Sin idioma anotado</option>
        </select>
        <span id="guardadosCuenta" class="tenue"></span>
        <button id="quitarTodos" type="button">Quitar todos</button>
      </div>
      <div id="guardadosLista"></div>
    </div>
    <div id="pegar" hidden>
      <textarea id="links" spellcheck="false" placeholder="Pegá los links, uno por renglón o todos juntos. Lo que no sea un link se ignora."></textarea>
      <div class="barra">
        <select id="linksModo" title="De dónde sale el número de cada capítulo">
          <option value="auto">Número: el de cada link</option>
          <option value="order">Número: en el orden pegado</option>
          <option value="reverse">Número: en el orden pegado, al revés</option>
        </select>
        <label>desde <input id="linksDesde" type="number" min="0" step="any" placeholder="1"></label>
        <button id="usarLinks" type="button">Usar estos links</button>
      </div>
    </div>
    <nav id="ruta"></nav>
  </header>

  <main>
    <section id="explorador">
      <!-- Si una carpeta donde mirar no está (Google Drive cerrado, un disco sin conectar) -->
      <div id="avisoCarpetas" hidden></div>
      <div id="estado" class="estado">Pegá una dirección arriba y tocá Analizar.</div>
      <!-- Antes de analizar nada: las últimas direcciones que se usaron -->
      <div id="inicio" hidden>
        <div class="tenue">Las últimas que analizaste</div>
        <div id="inicioLista"></div>
      </div>
      <!-- Del sitio que se está mirando: el link a su listado completo y su buscador -->
      <div id="pistas" class="barra" hidden>
        <span id="pistasLinks" class="barra"></span>
        <form id="buscarSitio" class="barra" hidden>
          <input id="buscarTexto" type="text" spellcheck="false" autocomplete="off" placeholder="🔎 Buscar en este sitio…" title="Usa el buscador del propio sitio y muestra acá lo que encuentra">
          <button id="buscarBoton" type="submit">Buscar</button>
        </form>
      </div>
      <div id="capitulo" class="tarjeta" hidden>
        <div><b id="capNombre"></b><span id="capDatos"></span></div>
        <div class="barra">
          <button id="capRevisar" type="button" title="Ver todas las imágenes del capítulo, con lo que se descarta como publicidad, y elegir cuáles van">Revisar páginas</button>
          <button class="main" id="capBajar" type="button">Descargar este capítulo</button>
        </div>
      </div>
      <!-- Revisar las páginas de un capítulo: todas sus imágenes, tildadas o no. Un toque las cambia -->
      <div id="revision" hidden>
        <div class="barra">
          <b id="revCuenta"></b>
          <button id="revTodas" type="button">Todas</button>
          <button id="revNinguna" type="button">Ninguna</button>
          <button id="revDetectadas" type="button" title="Volver a lo que eligió el filtro de publicidad">Como las detectó</button>
          <span class="tenue">Tocá una imagen para sacarla o ponerla.</span>
          <span class="estira"></span>
          <button id="revCerrar" type="button">Cerrar</button>
          <button class="main" id="revBajar" type="button">Descargar</button>
        </div>
        <div id="revLista"></div>
      </div>
      <div id="tabs"></div>
      <!-- De la serie que se está mirando: qué capítulos ya están en la carpeta -->
      <div id="enDisco" class="barra" hidden>
        <span id="enDiscoTexto"></span>
        <button id="marcarFaltan" type="button">Marcar los que faltan</button>
        <span id="enDiscoBotones" class="barra"></span>
      </div>
      <div id="herramientas" class="barra" hidden>
        <input id="filtro" type="text" spellcheck="false" autocomplete="off" placeholder="Filtrar…">
        <button id="todos" type="button">Todos</button>
        <button id="ninguno" type="button">Ninguno</button>
        <button id="sonCapitulos" type="button" hidden title="Si estos renglones son los capítulos de una serie (sin número en el nombre), tocá acá para poder tildarlos y bajarlos">Son capítulos</button>
        <button id="completar" type="button" hidden></button>
        <button id="verTapas" type="button" hidden title="Mostrar la lista como un mosaico, con la tapa de cada título">🖼 Tapas</button>
        <span id="cuenta" class="tenue"></span>
      </div>
      <div id="lista"></div>
      <div class="barra">
        <button id="siguiente" type="button" hidden title="Lee las 10 páginas siguientes de este listado y suma lo que encuentre">Traer más páginas</button>
        <button id="todasLasPaginas" type="button" hidden title="Sigue leyendo páginas hasta el final del listado (de a una, con una pausa; para a las 50)">Traer todas</button>
      </div>
    </section>

    <aside>
      <h2>Guardar</h2>
      <label class="campo">Serie
        <input id="serie" type="text" spellcheck="false" autocomplete="off" placeholder="Automática: sale del título de cada capítulo">
      </label>
      <div class="formatos">
        <label><input type="checkbox" id="fPdf"> PDF</label>
        <label><input type="checkbox" id="fCbz"> CBZ</label>
        <label><input type="checkbox" id="fImgs"> Imágenes</label>
      </div>
      <label class="opcion"><input type="checkbox" id="saltear"> Saltear lo que ya está en la carpeta</label>
      <div class="campo">Carpeta
        <div class="carpeta"><span id="carpeta" title=""></span><button id="cambiarCarpeta" type="button">Cambiar</button></div>
      </div>
      <!-- Tu colección: otras carpetas donde mirar lo que ya tenés (por ejemplo, la de Google Drive) -->
      <div class="campo">Tu colección
        <div id="bibliotecas"></div>
        <button id="agregarBiblioteca" type="button" title="Otra carpeta donde guardás tus mangas, cómics o libros: ahí también se mira lo que ya tenés">＋ Agregar una carpeta donde mirar</button>
      </div>
      <details id="nombres">
        <summary>Nombres y sagas</summary>
        <label class="campo">Plantilla del nombre
          <input id="plantilla" type="text" spellcheck="false" autocomplete="off" placeholder="{serie}/{saga}/{serie} {numero}">
        </label>
        <div class="barra" id="plantillas">
          <button type="button" data-tpl="{serie}/{saga}/{serie} {numero}">De siempre</button>
          <button type="button" data-tpl="{serie}/{volumen}/{serie} {numero}">Por tomo</button>
          <button type="button" data-tpl="{serie}/{volumen}/{serie} {numero} - {titulo}">Con título</button>
          <button type="button" data-tpl="{sitio}/{serie}/{serie} {numero}">Por sitio</button>
        </div>
        <div class="tenue">Una / crea una carpeta. Marcadores: {serie} {numero} {saga} {volumen} {titulo} {anio} {sitio}</div>
        <div id="plantillaVista"></div>
        <div id="plantillaAviso"></div>
        <label class="campo">Sagas propias
          <textarea id="sagas" spellcheck="false" placeholder="El nombre de la serie y, debajo, una saga por renglón:&#10;Naruto&#10;1-244 Parte 1&#10;245- Shippuden"></textarea>
        </label>
        <div class="barra">
          <button id="guardarSagas" type="button">Guardar sagas</button>
          <span id="sagasMsg" class="tenue"></span>
        </div>
      </details>
      <button class="main grande" id="descargar" type="button" disabled>Descargar</button>

      <h2>Cola <span id="colaCuenta" class="tenue"></span></h2>
      <div id="cola"><div class="vacio">Todavía no hay nada en la cola.</div></div>
      <div class="barra">
        <button id="cancelar" type="button" disabled>Cancelar</button>
        <button id="reintentar" type="button" disabled title="Vuelve a intentar todo lo que falló, quedó incompleto o se canceló">Reintentar lo que falló</button>
        <button id="limpiar" type="button" disabled>Limpiar terminados</button>
        <button id="abrirCarpeta" type="button">Abrir carpeta</button>
      </div>
    </aside>
  </main>
  <script src="ui.js"></script>
</body>
</html>
